services:
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: gomta-dragonfly
    restart: unless-stopped
    command: ["--default_lua_flags=allow-undeclared-keys"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - dragonfly-data:/data
    networks:
      - gomta-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gomta:
    build: .
    container_name: gomta
    restart: unless-stopped
    depends_on:
      dragonfly:
        condition: service_healthy
    # Host network: container shares the host's network stack so it can
    # bind to the server's public IP for outbound SMTP delivery.
    network_mode: host
    volumes:
      - ./configs:/etc/gomta:ro
    environment:
      # With host networking, dragonfly is reachable via its published port on localhost.
      - GOMTA_CACHE_ADDR=127.0.0.1:6379
      - GOMTA_LISTEN=:7140
    command: ["--config-dir", "/etc/gomta"]
    healthcheck:
      test: ["CMD", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dragonfly-data:

networks:
  gomta-net:
    driver: bridge
