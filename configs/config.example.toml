# gomta configuration

method = "direct"
local_ips = ["0.0.0.0"]

# IP lookup strategy:
# Ipv4Only, Ipv6Only, Ipv4AndIpv6, Ipv4ThenIpv6, Ipv6ThenIpv4
ip_lookup_strategy = "Ipv4Only"

# Relay settings
relay_host = "localhost"
relay_port = 25
relay_user = ""
relay_pass = ""
relay_tls = false
relay_auth = false
relay_timeout = 30   # seconds (0 = 30s default)

# Direct delivery
direct_port = 25
direct_helo = "localhost"
direct_tls = false
direct_timeout = 30

# HTTP injection
http_url = ""
http_method = "POST"
http_timeout = 30
http_auth_type = ""       # "bearer", "hmac-sha256", or "" (none)
http_auth_secret = ""     # token for bearer, secret key for HMAC

# TLS
tls_insecure_skip_verify = false
tls_ca_cert_file = ""

# Dragonfly / Redis cache
cache_addr = "127.0.0.1:6379"
cache_user = ""   # optional, leave empty if Redis has no ACL user
cache_pass = ""
cache_db = 0

# Queue
queue_size = 10000
queue_workers = 4

# Rate limiting
rate_limit_per_sec = 10

# Retry schedule: each entry is the delay before the Nth retry
# len(schedule) = max retries; first attempt has no delay
retry_schedule = ["1s", "5s", "5m"]

# IP family fallback: if IPv6 bind fails, retry with IPv4 (and vice versa)
# Enabled by default
ip_family_fallback = true

# Preflight
max_message_size = 26214400
max_recipients = 100
